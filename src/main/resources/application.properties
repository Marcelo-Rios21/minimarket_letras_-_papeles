spring.application.name=minimarket

# Configuracion base de datos H2
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWRlbW8tand0LXNlY3JldC1rZXktZm9yLW1pbmltYXJrZXQtMzItYnl0ZXM=}
app.jwt.expiration-ms=3600000
app.jwt.issuer=minimarket-letras-papeles